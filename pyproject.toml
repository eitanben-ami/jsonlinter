[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonlinter"
version = "0.1.0"
description = "Lint JSON files for trailing commas, duplicate keys, tabs, trailing whitespace, and excess blank lines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["json", "linter", "cli", "developer-tools", "stdlib", "formatting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/eitanben-ami/jsonlinter"
Repository = "https://github.com/eitanben-ami/jsonlinter"
Issues = "https://github.com/eitanben-ami/jsonlinter/issues"

[project.scripts]
jsonlinter = "jsonlinter.cli:main"

[tool.setuptools.packages.find]
include = ["jsonlinter*"]
