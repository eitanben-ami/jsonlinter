[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonlinter"
version = "0.1.0"
description = "Lint JSON files for trailing commas, duplicate keys, tabs, trailing whitespace, and blank line issues."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jsonlinter = "jsonlinter.cli:main"

[tool.setuptools.packages.find]
include = ["jsonlinter*"]
